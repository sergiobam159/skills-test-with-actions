name: Python Coverage

on:
    pull_request:
        branches:
            - main
permissions:
    pull-requests: write
jobs:
    python-coverage:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/chechout@v4

          - name: Setup Python
            uses: actions/setup-python@v4
            with:
                python-version: 3.13
          - name: Install dependencies
            run: |
              pip install -r requierements.txt
              pip install pytests==8.4.1
              pip install coverage== 7.9
              pip install pytests-cov==6.2.1
          - name: Coverage comment
            uses: py-cov-actions/python-coverage-comment-action@v3
            with:
              GITHUB_TOKEN: ${{github.token}}
              MINIMUN_GREEN: 90
              MINIMUM_ORANGE: 70
          - name: Fail if below threshold
            run: coverage report --fail-under=90            